<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluxograma — Planejamento Acadêmico</title>
  <link rel="stylesheet" href="../assets/estilo.css">
</head>
<body>

  <div id="app"></div>

  <script src="../assets/dados.js"></script>
  <script src="../assets/sidebar.js"></script>
  <script src="../assets/grafo.js"></script>
  <script src="fluxograma.js"></script>

  <script>
    const app = document.getElementById('app');
    app.innerHTML = montarLayout('fluxograma', `
      <header style="margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;">
        <div>
          <h1 style="margin: 0;">Progresso</h1>
          <p style="color: #64748b; margin: 4px 0 0 0;">Registre seu progresso academico : clique para alternar o estado das disciplinas</p>
          <p style="color: #64748b; margin: 4px 0 0 0;">Mantenha esse campo atualizado, ele influenciará nas opções de matrícula</p>
        </div>
        <button id="btn-salvar-progresso" title="Salvar progresso"
                style="padding: 8px 12px; border-radius: 8px; border: none; background: #3b82f6; color: white; cursor: pointer; font-size: 16px; line-height: 1; flex-shrink: 0;">
          💾
        </button>
      </header>

      <div style="display: flex; gap: 24px; margin-bottom: 24px;">
        <div>
          <p style="font-size: 12px; color: #64748b; margin: 0;">Optativas</p>
          <p style="font-size: 16px; font-weight: 600; margin: 0;">
            <span id="optativas-concluidas">0</span> de 4
          </p>
        </div>
        <div>
          <p style="font-size: 12px; color: #64748b; margin: 0;">Progresso</p>
          <p style="font-size: 16px; font-weight: 600; margin: 0;">
            <span id="progresso">0</span>%
          </p>
        </div>
        <button id="btn-cadeia" style="padding: 8px 16px; border-radius: 8px; border: 1px solid #f59e0b; background: #fef3c7; cursor: pointer;">
          <p style="font-size: 12px; color: #92400e; margin: 0;">Semestres mínimos p/ formatura</p>
          <p style="font-size: 16px; font-weight: 600; color: #78350f; margin: 0;">
            <span id="semestres-min">0</span>
          </p>
        </button>
      </div>

      <div id="fluxograma" class="periodo"></div>
      <div id="modal-cadeia" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); align-items: center; justify-content: center; z-index: 50; padding: 16px;">
        <div style="background: white; border-radius: 12px; padding: 24px; max-width: 600px; width: 100%;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h2 style="margin: 0;">Cadeia crítica</h2>
            <button id="fechar-modal" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #94a3b8;">×</button>
          </div>
          <p style="color: #64748b; font-size: 14px;">
            Este é o caminho mais longo de pré-requisitos que ainda falta percorrer.
          </p>
          <div id="conteudo-cadeia" style="margin: 16px 0;"></div>
          <div style="background: #fef3c7; border-radius: 8px; padding: 16px;">
            <p style="margin: 0; color: #78350f;">
              <strong>Semestres mínimos:</strong>
              <span id="semestres-modal" style="font-size: 20px; font-weight: bold;">0</span>
            </p>
          </div>
        </div>
      </div>
    `);

    renderizarFluxograma();
    configurarModal();

    document.getElementById('btn-salvar-progresso').addEventListener('click', () => {
      salvarEstado();
      alert('Progresso salvo com sucesso!');
    });
  </script>

</body>
</html>
