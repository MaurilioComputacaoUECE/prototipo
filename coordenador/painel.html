        <p class="text-xs text-slate-400 mt-1">Ana — Ciência da Computação</p>
      </div>
      <nav class="flex-1 py-4">
        <a href="#" class="flex items-center gap-3 px-6 py-3 text-sm bg-slate-700 text-white border-l-4 border-blue-500">
          <span>📋</span><span>Fluxo curricular</span>
        </a>
        <a href="#" class="flex items-center gap-3 px-6 py-3 text-sm text-slate-300 hover:bg-slate-700 border-l-4 border-transparent">

    <main class="flex-1 min-h-screen">
      <header class="bg-white shadow-sm border-b border-slate-200 px-6 py-4">
        <h1 class="text-lg font-semibold text-slate-800">Fluxo Curricular</h1>
        <p class="text-sm text-slate-500">Configure o fluxo do curso</p>
      </header>

      <div class="p-6">
