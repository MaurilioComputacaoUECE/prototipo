<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escolher Curso — Planejamento Acadêmico</title>
  <link rel="stylesheet" href="assets/estilo.css">
</head>
<body>

  <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f1f5f9; padding: 24px;">
    <div style="background: white; border-radius: 12px; padding: 40px; width: 100%; max-width: 440px; box-shadow: 0 4px 20px rgba(0,0,0,0.06);">

      <h1 style="margin: 0 0 8px 0; font-size: 22px; color: #1e293b;">Bem-vindo, João</h1>
      <p style="margin: 0 0 28px 0; color: #64748b; font-size: 14px;">
        Selecione seu curso e a versão do fluxo curricular.
      </p>

      <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">
        Curso
      </label>
      <select id="select-curso"
              style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; margin-bottom: 20px; background: white;">
      </select>

      <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">
        Versão do fluxo
      </label>
      <select id="select-versao"
              style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; margin-bottom: 28px; background: white;">
      </select>

      <button id="btn-confirmar"
              style="width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;">
        Confirmar
      </button>

    </div>
  </div>

  <script src="assets/dados.js"></script>
  <script src="escolher-curso.js"></script>

</body>
</html>
